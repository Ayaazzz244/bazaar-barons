name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      HAS_KEYSTORE: ${{ secrets.KEYSTORE_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
  
      - name: Install and sync web app
        run: |
          npm ci
          npx cap sync android
      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug
      - name: Build signed release (AAB for Play Store + APK)
        if: env.HAS_KEYSTORE == 'true'
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          BB_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          BB_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          BB_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        working-directory: android
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > $RUNNER_TEMP/upload.jks
          export BB_KEYSTORE_PATH=$RUNNER_TEMP/upload.jks
          ./gradlew bundleRelease assembleRelease
      - uses: actions/upload-artifact@v4
        with:
          name: bazaar-barons-apk
          path: |
            android/app/build/outputs/apk/**/*.apk
            android/app/build/outputs/bundle/**/*.aab
